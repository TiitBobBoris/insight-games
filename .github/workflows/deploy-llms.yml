# Saidi juurkausta llms.txt -> www.sportsport.ee/llms.txt (sama Elkdata SFTP, mis Pesa lehel).
# Fail asub repos site/llms.txt; serveris läheb see Pesa kausta (ELKDATA_SFTP_PATH) ülemkausta ehk saidi juurde.
name: llms.txt -> sportsport.ee

on:
  push:
    branches: [tube-main]
    paths: [site/llms.txt, .github/workflows/deploy-llms.yml]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lae llms.txt saidi juurkausta
        env:
          HOST: ${{ secrets.ELKDATA_SFTP_HOST }}
          USER: ${{ secrets.ELKDATA_SFTP_USER }}
          PASS: ${{ secrets.ELKDATA_SFTP_PASSWORD }}
          DEST_ROOT: ${{ secrets.ELKDATA_SFTP_PATH }}
          PROTO: ${{ secrets.ELKDATA_PROTOCOL }}
        run: |
          test -n "$HOST" || { echo "::error::ELKDATA_SFTP_* saladused puuduvad"; exit 1; }
          ROOT=$(dirname "${DEST_ROOT%/}")
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -u "$USER","$PASS" "${PROTO:-sftp}://$HOST" -e "
            set sftp:auto-confirm yes; set ftp:ssl-allow yes; set net:max-retries 3;
            get $ROOT/llms.txt -o llms.backup.txt;
            put site/llms.txt -o $ROOT/llms.txt;
            bye"
      - name: Kontrolli
        run: |
          sleep 5
          curl -s "https://www.sportsport.ee/llms.txt?v=$GITHUB_SHA" | grep -q "## Pesa majad" && echo "llms.txt OK"
