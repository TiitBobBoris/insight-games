name: Import full TUBE images

on:
  push:
    branches:
      - tmp/tube-v5-auto-offer
    paths:
      - .github/workflows/tube-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: tmp/tube-v5-auto-offer
          fetch-depth: 0

      - name: Download source images from Dropbox
