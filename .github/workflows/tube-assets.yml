          curl -L --fail --retry 3 'https://uc33d517669b0098fcc712090078.dl.dropboxusercontent.com/cd/0/get/DKIv7KIxengCZX2f1q30vUtUH7ZINqckHu6i2lmTuX9lisw3w68o-2RoToYfmE1PTm7h6PxOf9UhuW569Xnb7U62nc7Zm5kwmQIbDjCAyW4GcGswqVxKDtYc4GPBbHNPHWHv6d4ShN2l-VUzq5jWXoLjepgrgDU-CCMA3St65dOYrQ/file?c_luid=0bf567ce' -o tube-assets-src/model-1.jpg
          curl -L --fail --retry 3 'https://ucddbd2e2380409d1ffcd4c094bb.dl.dropboxusercontent.com/cd/0/get/DKKpEQq7ouc5KHEOZgMl-9uyxBQdyjJAB2wcZwk3Q7rqh_c-wjYvVsSb699LcWElbmObXLXUMI735Pvf4d6tm2vC2CM7RQhDSLBUhT7O0LSsq8IGbuQsnxIOE39qofBVWSgrHp-IyR4IAATW1x2tpoLyUIri8EmvLZDhgtCW6wAqrA/file?c_luid=0bf567ce' -o tube-assets-src/model-2.jpg
          curl -L --fail --retry 3 'https://ucc83b305f7bdebcb47a2871af0c.dl.dropboxusercontent.com/cd/0/get/DKJjPV4CTTmKtBP12hSwU5N9FQ15ZI96pqcgdYkbjhwCx8UDbN1NINukwA9fL5iMs41B7dWLG8qOZzPn58EXHZnujUQmSsijCtnNyunbXvdojGR_AvGnJMI2xbzTvxawuogsvosgV21N95MoUr2XOuygM3IRIlveTe-PrwEt34Ltjg/file?c_luid=0bf567ce' -o tube-assets-src/model-3.jpg
          curl -L --fail --retry 3 'https://uc7b432ed782f408b4b37d48feb5.dl.dropboxusercontent.com/cd/0/get/DKJTJt4dZV64ylBI_gJ__nIT5tDWj2w971j27Qu4Xbv6IwaZtI0jm4gcuOhLxs4Fz8C4niO6BXfbJsedVFaSjALxelWTv_UKauVEnR8ckIN04L9yQnO-e1zLUD4ucpvgvE2QQsJkhxUhSrDnA0jrCCSGx4s4w_oUQDZn-krnQQ6H-A/file?c_luid=0bf567ce' -o tube-assets-src/model-4.jpg
          ls -lh tube-assets-src

      - name: Optimise images for web
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('tube-assets-src')
          dst = Path('tube-assets')
          dst.mkdir(exist_ok=True)
          for path in sorted(src.glob('*.jpg')):
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((2400, 1800), Image.Resampling.LANCZOS)
                  target = dst / f'{path.stem}.webp'
                  im.save(target, 'WEBP', quality=86, method=6)
                  print(target, target.stat().st_size)
          PY

      - name: Commit full local images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tube-assets
          git commit -m 'fix: add full locally hosted TUBE images [skip ci]'
          git push origin HEAD:tmp/tube-v5-auto-offer
