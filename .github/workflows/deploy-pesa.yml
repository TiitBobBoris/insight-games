# Pesa majade leht -> www.sportsport.ee/pesa/ (veebimajutus.ee, SFTP või FTP).
# Käivitub, kui haru tube-main uueneb. Saladused lisab Tiit: repo Settings -> Secrets and variables -> Actions.
#   ELKDATA_SFTP_HOST      serveri aadress (veebimajutus.ee haldusest, FTP/SSH andmed)
#   ELKDATA_SFTP_USER      kasutajanimi
#   ELKDATA_SFTP_PASSWORD  parool
#   ELKDATA_SFTP_PATH      sihtkaust serveris, nt public_html/pesa  (või domains/sportsport.ee/public_html/pesa)
#   ELKDATA_PROTOCOL       valikuline: sftp (vaikimisi) või ftp
name: Pesa leht -> sportsport.ee/pesa

on:
  push:
    branches: [tube-main]
  workflow_dispatch:

concurrency:
  group: deploy-pesa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SFTP: ${{ secrets.ELKDATA_SFTP_HOST != '' }}
    steps:
      - name: SFTP andmed puudu -> jäta vahele
        if: env.HAS_SFTP != 'true'
        run: echo "::notice::ELKDATA_SFTP_* saladused puuduvad, üleslaadimine jäeti vahele."

      - uses: actions/checkout@v4
        if: env.HAS_SFTP == 'true'

      - name: Koosta avalik kaust
        if: env.HAS_SFTP == 'true'
        run: |
          mkdir -p dist
          cp index.html dist/
          printf 'DirectoryIndex index.html\nRewriteEngine Off\n' > dist/.htaccess
          # Versioon failiviidetele, et brauserid ei kasutaks vana vahemälu.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" dist/index.html
          cp -r tube-assets tube-editor dist/

      - name: Lae Elkdatasse (SFTP)
        if: env.HAS_SFTP == 'true'
        env:
          HOST: ${{ secrets.ELKDATA_SFTP_HOST }}
          USER: ${{ secrets.ELKDATA_SFTP_USER }}
          PASS: ${{ secrets.ELKDATA_SFTP_PASSWORD }}
          DEST: ${{ secrets.ELKDATA_SFTP_PATH }}
          PROTO: ${{ secrets.ELKDATA_PROTOCOL }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -u "$USER","$PASS" "${PROTO:-sftp}://$HOST" -e "
            set sftp:auto-confirm yes;
            set ftp:ssl-allow yes;
            set net:max-retries 3;
            mkdir -p -f $DEST;
            mirror --reverse --delete --verbose --parallel=4 --exclude-glob index.html dist/ $DEST/;
            put dist/index.html -o $DEST/index.html;
            bye"

      - name: Kontrolli
        if: env.HAS_SFTP == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.sportsport.ee/pesa/)
          echo "https://www.sportsport.ee/pesa/ -> $code"
          test "$code" = "200"
