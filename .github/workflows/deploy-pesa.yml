# Pesa majade leht -> www.sportsport.ee/pesa/ (veebimajutus.ee, SFTP või FTP).
# Käivitub, kui haru tube-main uueneb. Saladused lisab Tiit: repo Settings -> Secrets and variables -> Actions.
#   ELKDATA_SFTP_HOST      serveri aadress (veebimajutus.ee haldusest, FTP/SSH andmed)
#   ELKDATA_SFTP_USER      kasutajanimi
#   ELKDATA_SFTP_PASSWORD  parool
#   ELKDATA_SFTP_PATH      sihtkaust serveris, nt public_html/pesa  (või domains/sportsport.ee/public_html/pesa)
#   ELKDATA_PROTOCOL       valikuline: sftp (vaikimisi) või ftp
name: Pesa leht -> sportsport.ee/pesa

on:
  push:
    branches: [tube-main, tube-preview]
  workflow_dispatch:

concurrency:
  group: deploy-pesa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SFTP: ${{ secrets.ELKDATA_SFTP_HOST != '' }}
    steps:
      - name: SFTP andmed puudu -> jäta vahele
        if: env.HAS_SFTP != 'true'
        run: echo "::notice::ELKDATA_SFTP_* saladused puuduvad, üleslaadimine jäeti vahele."

      - uses: actions/checkout@v4
        if: env.HAS_SFTP == 'true'

      - name: Koosta avalik kaust
        if: env.HAS_SFTP == 'true'
        run: |
          mkdir -p dist
          cp index.html joonised.html joonised-dl.php dist/
          # AVIF: kui brauser oskab ja kõrval on sama nimega .avif, serveeri .webp asemel see (HTML jääb samaks).
          printf '%s\n' 'DirectoryIndex index.html' 'AddType image/avif .avif' '<IfModule mod_rewrite.c>' 'RewriteEngine On' \
            'RewriteCond %{HTTP_ACCEPT} image/avif' 'RewriteCond %{REQUEST_FILENAME} ^(.+)\.webp$' 'RewriteCond %1.avif -f' \
            'RewriteRule ^(.+)\.webp$ $1.avif [T=image/avif,E=avif:1,L]' '</IfModule>' \
            '<IfModule mod_headers.c>' 'Header append Vary Accept env=avif' 'Header append Vary Accept env=REDIRECT_avif' '</IfModule>' > dist/.htaccess
          # Versioon failiviidetele, et brauserid ei kasutaks vana vahemälu.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" dist/index.html
          # Eelvaade (haru tube-preview -> /pesa/eelvaade/): otsingumootorid ei indekseeri.
          if [ "$GITHUB_REF_NAME" = tube-preview ]; then sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' dist/index.html; fi
          cp -r tube-assets tube-editor dist/

      - name: Lae Elkdatasse (SFTP)
        if: env.HAS_SFTP == 'true'
        env:
          HOST: ${{ secrets.ELKDATA_SFTP_HOST }}
          USER: ${{ secrets.ELKDATA_SFTP_USER }}
          PASS: ${{ secrets.ELKDATA_SFTP_PASSWORD }}
          DEST_ROOT: ${{ secrets.ELKDATA_SFTP_PATH }}
          PROTO: ${{ secrets.ELKDATA_PROTOCOL }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          if [ "$GITHUB_REF_NAME" = tube-preview ]; then DEST="$DEST_ROOT/eelvaade"; else DEST="$DEST_ROOT"; fi
          lftp -u "$USER","$PASS" "${PROTO:-sftp}://$HOST" -e "
            set sftp:auto-confirm yes;
            set ftp:ssl-allow yes;
            set net:max-retries 3;
            mkdir -p -f $DEST;
            mirror --reverse --delete --verbose --parallel=4 --exclude-glob index.html --exclude ^_joonised/ --exclude ^eelvaade/ dist/ $DEST/;
            put dist/index.html -o $DEST/index.html;
            bye"

      - name: Kontrolli
        if: env.HAS_SFTP == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.sportsport.ee/pesa/)
          echo "https://www.sportsport.ee/pesa/ -> $code"
          test "$code" = "200"
