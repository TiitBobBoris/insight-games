      - name: Commit permanent web photos
        run: |
          git config user.name "TUBE asset importer"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tube-assets/photo-library/
          git commit -m "assets: store 45 TUBE photos permanently as WebP" || exit 0
          git push origin HEAD:tmp/tube-v5-auto-offer
