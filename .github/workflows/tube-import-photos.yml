          root=pathlib.Path('tube-assets/photo-library');root.mkdir(parents=True,exist_ok=True)
          manifest=[];failures=[]
          for i,p in enumerate(files):
           try:
            r=requests.get(p['url'],timeout=65);r.raise_for_status()
            im=Image.open(io.BytesIO(r.content));im=ImageOps.exif_transpose(im).convert('RGB')
            im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
            group=re.sub(r'[^a-z0-9]+','-',p['group'].lower()).strip('-')
            name=f'{group}-{i+1:03}.webp'
            im.save(root/name,'WEBP',quality=82,method=5)
            manifest.append({'group':p['group'],'name':p['name'],'src':'./tube-assets/photo-library/'+name,'width':im.width,'height':im.height})
            print('OK',i,p['name'],flush=True)
           except Exception as e:
            failures.append([i,p['name'],str(e)]);print('FAIL',i,p['name'],str(e),flush=True)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'import-report.json').write_text(json.dumps({'imported':len(manifest),'failed':failures},ensure_ascii=False,indent=2),encoding='utf-8')
          
